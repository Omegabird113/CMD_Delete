plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name + "-fabric"
}

configurations {
    shadeOnly
}

sourceSets {
    main {
        java.srcDir project(":common").sourceSets.main.java
        resources.srcDir project(":common").sourceSets.main.resources
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
    test {
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation project(":common")

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    shadeOnly 'com.google.code.gson:gson:2.14.0'
    shadeOnly 'org.jspecify:jspecify:1.0.1'
    shadeOnly 'commons-codec:commons-codec:1.22.1'

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    inputs.property "loader_min_version", project.loader_min_version
    inputs.property "fabric_min_version", project.fabric_min_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version,
                "loader_min_version": project.loader_min_version,
                "fabric_min_version": project.fabric_min_version
    }
}

test {
    useJUnitPlatform()
}

loom {
    mods {
        "cmd_delete" {
            sourceSet sourceSets.main
            configuration configurations.shadeOnly
        }
    }

    runs {
        client {
            client()
        }

        ciClient {
            client()
            getJvmArguments().add("-Dcmd_delete.ci.stopMinecraftAfterLoad=true")
        }

        server {
            server()
        }
    }
}
