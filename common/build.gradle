plugins {
    id 'java'
    id "dev.architectury.loom-no-remap"
    id 'com.gradleup.shadow' version '9.6.1'
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

configurations {
    shadeOnly
}

sourceSets {
    main {
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
    test {
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"

    shadeOnly 'com.google.code.gson:gson:2.14.0'
    shadeOnly 'org.jspecify:jspecify:1.0.1'
    shadeOnly 'commons-codec:commons-codec:1.22.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
