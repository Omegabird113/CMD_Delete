import com.github.jengelman.gradle.plugins.shadow.relocation.SimpleRelocator

plugins {
    id 'java'
    id "dev.architectury.loom-no-remap"
    id 'com.gradleup.shadow' version '9.6.1'
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

configurations {
    shadeOnly
}

sourceSets {
    main {
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
    test {
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    compileOnly "org.spongepowered:mixin:0.8.7"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"

    shadeOnly 'com.google.code.gson:gson:2.14.0'
    shadeOnly 'org.jspecify:jspecify:1.0.1'
    shadeOnly 'commons-codec:commons-codec:1.22.1'
}

tasks.shadowJar {
    configurations.set([project.configurations.shadeOnly] as Set)
    relocators.add(new SimpleRelocator(
            'org.apache.commons.codec',
            'io.github.omegabird113.cmd_delete.libs.commons.codec',
            [] as List<String>,
            [] as List<String>,
            false,
            false
    ))
    relocators.add(new SimpleRelocator(
            'com.google',
            'io.github.omegabird113.cmd_delete.libs.google',
            [] as List<String>,
            [] as List<String>,
            false,
            false
    ))
    relocators.add(new SimpleRelocator(
            'org.jspecify',
            'io.github.omegabird113.cmd_delete.libs.jspecify',
            [] as List<String>,
            [] as List<String>,
            false,
            false
    ))
    relocators.add(new SimpleRelocator(
            'org.jetbrains',
            'io.github.omegabird113.cmd_delete.libs.jetbrains',
            [] as List<String>,
            [] as List<String>,
            false,
            false
    ))
    from("${rootDir}/LICENSE") {
        rename { "LICENSE.txt" }
    }
    from("${rootDir}/NOTICE") {
        rename { "NOTICE.txt" }
    }
    from("${rootDir}/licenses/") {
        into("licenses/")
    }
    archiveClassifier.set('')
}

tasks.jar {
    archiveClassifier.set('dev')
    from("${rootDir}/LICENSE") {
        rename { "LICENSE.txt" }
    }
    from("${rootDir}/NOTICE") {
        rename { "NOTICE.txt" }
    }
}

tasks.build {
    dependsOn tasks.shadowJar
}

test {
    useJUnitPlatform()
}

