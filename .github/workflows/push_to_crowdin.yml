name: Crowdin Push on Commit

on:
  push:
    branches: [ master ]
    paths:
      - 'src/main/resources/assets/**/lang/en_us.json'
      - '.github/workflows/push_to_crowdin.yml'
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  crowdin-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push sources to Crowdin
        uses: crowdin/github-action@5b9790df740c85af5412a3a3a91b24988d5d324f #v3.5.1
        with:
          config: crowdin.yml
          crowdin_branch_name: master
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
