name: Release

on:
  workflow_dispatch:
    inputs:
      release_title:
        description: "Release title (e.g. CMD + Delete 1.3.0 Beta 2)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            build_task: :fabric:build
            client_task: :fabric:runCiClient
            client_args: ""
          - loader: neoforge
            build_task: :neoforge:build
            client_task: :neoforge:runClient
            client_args: -Dcmd_delete.ci.stopMinecraftAfterLoad=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: "microsoft"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ${{ matrix.loader }}
        run: ./gradlew ${{ matrix.build_task }} --stacktrace --no-daemon

      - name: Sanity-test ${{ matrix.loader }} client load
        run: xvfb-run ./gradlew ${{ matrix.client_args }} ${{ matrix.client_task }} --no-daemon

      - name: Upload ${{ matrix.loader }} JARs as artifact
        uses: actions/upload-artifact@v7
        with:
          name: cmd-delete-release-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check that changelog exists
        run: |
          set -euo pipefail
          test -f changelog.md || {
            echo "Missing changelog.md"
            exit 1
          }

      - name: Read gradle.properties
        id: props
        run: |
          set -euo pipefail
          version=$(grep -E '^mod_version\s*=' gradle.properties | sed 's/.*=\s*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.props.outputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: Release ${{ steps.props.outputs.version }} already exists"
            exit 1
          fi

      - name: Download built JARs
        uses: actions/download-artifact@v7
        with:
          pattern: cmd-delete-release-*
          path: release-builds
          merge-multiple: false

      - name: Locate built JARs
        id: jars
        run: |
          set -euo pipefail

          find_release_jar() {
            local loader="$1"
            local artifact_dir="release-builds/cmd-delete-release-${loader}"
            mapfile -t jars < <(
              find "$artifact_dir" -maxdepth 1 -type f -name "*.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-javadoc.jar" \
                ! -name "*-dev.jar" \
                ! -name "*-dev-shadow.jar" \
                ! -name "*-shadow.jar"
            )

            if [ "${#jars[@]}" -ne 1 ]; then
              echo "ERROR: Expected exactly one ${loader} release JAR, found ${#jars[@]}."
              printf ' - %s\n' "${jars[@]}"
              exit 1
            fi

            printf '%s' "${jars[0]}"
          }

          echo "fabric=$(find_release_jar fabric)" >> "$GITHUB_OUTPUT"
          echo "neoforge=$(find_release_jar neoforge)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" != "release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ steps.props.outputs.version }}" \
            "${{ steps.jars.outputs.fabric }}" \
            "${{ steps.jars.outputs.neoforge }}" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.release_title }}" \
            --notes-file changelog.md \
            $PRERELEASE_FLAG

      - name: Publish Fabric to Modrinth & CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: xrOWVab9
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1455987
          curseforge-token: ${{ secrets.CF_API_TOKEN }}
          files: ${{ steps.jars.outputs.fabric }}
          name: ${{ inputs.release_title }}
          version: ${{ steps.props.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: changelog.md
          java: 25
          game-versions: |
            >=26.1 <=26.2
          loaders: |
            fabric
            quilt
          environment: client
          fail-mode: skip

      - name: Publish NeoForge to Modrinth & CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: xrOWVab9
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1455987
          curseforge-token: ${{ secrets.CF_API_TOKEN }}
          files: ${{ steps.jars.outputs.neoforge }}
          name: ${{ inputs.release_title }}
          version: ${{ steps.props.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: changelog.md
          java: 25
          game-versions: |
            >=26.1 <=26.2
          loaders: neoforge
          environment: client
          fail-mode: skip
