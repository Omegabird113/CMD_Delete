name: JUint, Compiling, Client, & Docs Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build
      run: ./gradlew build --no-daemon

    - name: Test client load
      run: xvfb-run ./gradlew runCiClient --no-daemon

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
      if: success() || failure()
      with:
        include_passed: true
        detailed_summary: true
        report_paths: '**/build/test-results/test/TEST-*.xml'

    - name: Upload jar
      uses: actions/upload-artifact@v7
      with:
        name: cmd-delete-build
        path: build/libs/*.jar

  docs_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Cache Pip Zensical Dependency
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-zensical
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install/Upgrade Zensical
        run: pip install --upgrade zensical

      - name: Test Docs build
        run: zensical build --clean