name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        include:
          - loader: fabric
            build_task: :fabric:build
            client_task: :fabric:runCiClient
            client_args: ""
          - loader: neoforge
            build_task: :neoforge:build
            client_task: :neoforge:runClient
            client_args: -Dcmd_delete.ci.stopMinecraftAfterLoad=true

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.loader }}
        run: ./gradlew ${{ matrix.build_task }} --no-daemon

      - name: Test ${{ matrix.loader }} client load
        run: xvfb-run ./gradlew ${{ matrix.client_args }} ${{ matrix.client_task }} --no-daemon

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: success() || failure()
        with:
          include_passed: true
          detailed_summary: true
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: cmd-delete-${{ matrix.loader }}-build
          path: ${{ matrix.loader }}/build/libs/*.jar

  docs_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Cache Pip Zensical Dependency
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-zensical
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install/Upgrade Zensical
        run: pip install --upgrade zensical

      - name: Test Docs build
        run: zensical build --clean