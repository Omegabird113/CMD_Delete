import com.github.jengelman.gradle.plugins.shadow.relocation.SimpleRelocator

plugins {
    id 'net.neoforged.moddev' version '2.0.146'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'maven-publish'
}

version = "${rootProject.version}-neoforge"

base {
    archivesName = project.archives_base_name
}

configurations {
    shadeOnly
}

sourceSets {
    main {
        java.srcDirs += project(":common").sourceSets.main.java.srcDirs
        resources.srcDirs += project(":common").sourceSets.main.resources.srcDirs
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
    test {
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
}

dependencies {
    shadeOnly 'com.google.code.gson:gson:2.14.0'
    shadeOnly 'org.jspecify:jspecify:1.0.1'
    shadeOnly 'commons-codec:commons-codec:1.22.1'
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'cmd_delete.ci.stopMinecraftAfterLoad', System.getProperty('cmd_delete.ci.stopMinecraftAfterLoad', 'false')
        }
    }

    mods {
        cmd_delete {
            sourceSet sourceSets.main
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "neoforge_min_version", project.neoforge_min_version
    filteringCharset "UTF-8"

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
            "neoforge_min_version": project.neoforge_min_version
    }
}

tasks.shadowJar {
    configurations.set([project.configurations.shadeOnly] as Set)
    relocators.add(new SimpleRelocator(
        'org.apache.commons.codec',
        'io.github.omegabird113.cmd_delete.libs.commons.codec',
        [] as List<String>,
        [] as List<String>,
        false,
        false
    ))
    relocators.add(new SimpleRelocator(
        'com.google',
        'io.github.omegabird113.cmd_delete.libs.google',
        [] as List<String>,
        [] as List<String>,
        false,
        false
    ))
    relocators.add(new SimpleRelocator(
        'org.jspecify',
        'io.github.omegabird113.cmd_delete.libs.jspecify',
        [] as List<String>,
        [] as List<String>,
        false,
        false
    ))
    relocators.add(new SimpleRelocator(
        'org.jetbrains',
        'io.github.omegabird113.cmd_delete.libs.jetbrains',
        [] as List<String>,
        [] as List<String>,
        false,
        false
    ))
    from("${rootDir}/LICENSE") {
        rename { "LICENSE.txt" }
    }
    from("${rootDir}/NOTICE") {
        rename { "NOTICE.txt" }
    }
    from("${rootDir}/licenses/") {
        into("licenses/")
    }
    archiveClassifier.set('')
}

tasks.jar {
    archiveClassifier.set('dev')
    from("${rootDir}/LICENSE") {
        rename { "LICENSE.txt" }
    }
    from("${rootDir}/NOTICE") {
        rename { "NOTICE.txt" }
    }
}

tasks.build {
    dependsOn tasks.shadowJar
}

def devMappingsDir = layout.buildDirectory.dir("dev-mappings")

tasks.register("prepareDevMappings", Sync) {
    from(project(":common").sourceSets.main.resources) {
        include "mappings/**"
    }
    into(devMappingsDir)
}

tasks.named("runClient") {
    dependsOn("prepareDevMappings")
    systemProperty "cmd_delete.dev.mappings", devMappingsDir.get().asFile.absolutePath
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.maven_group
            artifactId = project.archives_base_name + "-neoforge"
            version = project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${System.getenv('MAVEN_PASS_DIR')}"
        }
    }
}
