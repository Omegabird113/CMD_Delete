plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name + "-neoforge"
}

configurations {
    shadeOnly
}

sourceSets {
    main {
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
    test {
        compileClasspath += configurations.shadeOnly
        runtimeClasspath += configurations.shadeOnly
    }
}

repositories {
    // NeoForged's maven is added by the gradle plugin
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"

    implementation project(":common")

    shadeOnly 'com.google.code.gson:gson:2.14.0'
    shadeOnly 'org.jspecify:jspecify:1.0.1'
    shadeOnly 'commons-codec:commons-codec:1.22.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filteringCharset "UTF-8"

    filesMatching("neoforge.mods.toml") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version
    }
}

tasks.jar {
    from("${rootDir}/LICENSE") {
        rename { "LICENSE.txt" }
    }
    from("${rootDir}/NOTICE") {
        rename { "NOTICE.txt" }
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.maven_group
            artifactId = project.archives_base_name + "-neoforge"
            version = project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${System.getenv('MAVEN_PASS_DIR')}"
        }
    }
}

